<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f6f9fc;
        padding: 0;
        margin: 0;
      }
      .container {
        max-width: 480px;
        background: #ffffff;
        margin: 40px auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.08);
      }
      h2 {
        color: #333;
        text-align: center;
      }
      p {
        font-size: 16px;
        color: #555;
        line-height: 1.6;
      }
      .code-box {
        background: #f1f5f9;
        padding: 15px;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 6px;
        text-align: center;
        color: #111827;
        border-radius: 8px;
        margin-top: 20px;
      }
      .footer {
        margin-top: 25px;
        text-align: center;
        font-size: 14px;
        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Email Verification</h2>

      <p>Hello,</p>

      <p>
        Thank you for creating an account on creatiVerse. Please use the verification code below
        to complete your email verification:
      </p>

      <div class="code-box">
        {{CODE}}
      </div>

      <p>If you did not request this, you can safely ignore this email.</p>

      <div class="footer">
        &copy; 2025 creatiVerse. All rights reserved.
      </div>
    </div>
  </body>
</html>
